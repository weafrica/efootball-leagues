<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Department Store</title>

    <!-- Standalone shop PWA. Same origin and same Supabase backend as the
         main Matchday app, but its own manifest/id/scope so it installs as
         a separate app with its own icon and opens straight into the shop.
         Entry: src/shop-main.jsx -> src/ShopApp.jsx (does NOT import
         App.jsx, so the shop doesn't download the whole league app). -->
    <link rel="manifest" href="/shop-app/manifest.webmanifest" />
    <meta name="theme-color" content="#0B1F17" />
    <link rel="icon" type="image/png" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Shop" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/shop-main.jsx"></script>
  </body>
</html>
