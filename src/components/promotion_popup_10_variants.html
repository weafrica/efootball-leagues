<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Promotion Popup — 10 Variants</title>
<style>
  :root{
    --bg-deep:#07110C;
  }
  * { box-sizing: border-box; }
  html, body {
    margin:0; min-height:100%;
    background: var(--bg-deep);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow-x:hidden;
  }

  /* ===== Picker bar ===== */
  #picker {
    position: sticky; top:0; z-index: 60;
    display:flex; flex-wrap:wrap; gap:8px;
    padding: 14px 16px;
    background: rgba(4,9,6,0.9);
    border-bottom: 1px solid #1E3A2A;
  }
  #picker button {
    background:#0F2318; color:#CFE0D5; border:1px solid #1E3A2A;
    padding:8px 14px; border-radius:999px; font-size:13px; cursor:pointer;
  }
  #picker button:hover, #picker button.active { border-color: var(--accent, #E8B44C); color:#fff; }
  #stage { min-height: 88vh; display:flex; align-items:center; justify-content:center; position:relative; }

  /* ===== Overlay shell (shared) ===== */
  #overlay {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    z-index:10;
  }
  .backdrop-flash::before{
    content:""; position:absolute; inset:0;
    background: radial-gradient(circle at 50% 42%, color-mix(in srgb, var(--accent) 35%, transparent), transparent 60%);
    animation: flashPop .5s ease-out forwards;
  }
  @keyframes flashPop { 0%{opacity:0;} 30%{opacity:1;} 100%{opacity:0;} }

  .rays {
    position:absolute; width:520px; height:520px;
    background: conic-gradient(from 0deg, color-mix(in srgb, var(--accent) 20%, transparent) 0deg 10deg, transparent 10deg 30deg);
    border-radius:50%;
    animation: spin 14s linear infinite;
    filter: blur(1px);
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .card {
    position:relative; width:340px;
    background: linear-gradient(180deg, var(--panel, #0F2318), #0A1A12);
    border:1px solid var(--panel-line, #1E3A2A);
    border-radius:16px; padding:36px 28px 28px; text-align:center;
    transform: scale(.4); opacity:0;
  }
  #overlay.show .card { animation: cardIn .55s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes cardIn { 0%{transform:scale(.4);opacity:0;} 60%{transform:scale(1.06);opacity:1;} 100%{transform:scale(1);opacity:1;} }

  .eyebrow { color:#7E9686; font-size:12px; letter-spacing:.04em; margin:0 0 18px; }
  h1 { margin:0 0 6px; font-size:22px; color:#F1F5EE; }
  .tier-move { display:flex; align-items:center; justify-content:center; gap:10px; margin:14px 0 20px; color:#7E9686; font-size:14px; }
  .tier-move b { color:#F1F5EE; font-size:16px; }
  .tier-move .to b { color: var(--accent-hi, var(--accent)); }
  .arrow { color: var(--accent); font-size:16px; }
  .rank-line { font-size:13px; color:#7E9686; margin-bottom:24px; }
  .rank-line strong { color:#F1F5EE; font-variant-numeric: tabular-nums; }
  button.cta {
    width:100%; background: var(--accent); color:#1A1206;
    border:none; padding:13px; border-radius:10px; font-size:15px; font-weight:700; cursor:pointer;
  }
  button.cta:hover { background: var(--accent-hi, var(--accent)); }

  /* ===== Badge base + shape variants ===== */
  .badge-wrap { margin: 0 auto 18px; position:relative; width:112px; height:112px; display:flex; align-items:center; justify-content:center; }
  .badge {
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    position:relative;
    background: linear-gradient(160deg, var(--accent-hi), var(--accent) 55%, var(--accent-lo, #7a5420));
  }
  .badge span { font-size:32px; font-weight:800; color:#1A1206; position:relative; z-index:2; }
  .badge::after{
    content:""; position:absolute; inset:0;
    background: linear-gradient(120deg, transparent 40%, rgba(255,255,255,.55) 50%, transparent 60%);
    background-size:250% 250%; background-position:-100% -100%;
  }
  #overlay.show .badge::after{ animation: shine 1.4s ease-out .5s forwards; }
  @keyframes shine { to { background-position:100% 100%; } }

  .shape-shield  { clip-path: polygon(50% 0%,100% 18%,100% 62%,50% 100%,0% 62%,0% 18%); }
  .shape-circle  { border-radius:50%; }
  .shape-diamond { border-radius: 12px; transform: rotate(45deg); }
  .shape-diamond span { transform: rotate(-45deg); display:inline-block; }
  .shape-card    { width:96px; height:130px; border-radius:10px; }

  /* ===== Medal ribbon (variant 2) ===== */
  .ribbon { position:absolute; top:-8px; width:0; height:0; z-index:1; }
  .ribbon.left  { left:14px;  border-left:22px solid var(--ribbon,#B23A3A); border-bottom:46px solid transparent; transform-origin: top; animation: ribbonSway 2.6s ease-in-out infinite; }
  .ribbon.right { right:14px; border-right:22px solid var(--ribbon,#B23A3A); border-bottom:46px solid transparent; transform-origin: top; animation: ribbonSway 2.6s ease-in-out infinite reverse; }
  @keyframes ribbonSway { 0%,100%{ transform:rotate(-4deg);} 50%{ transform:rotate(4deg);} }

  /* ===== Arcade ring (variant 3) ===== */
  .arcade-ring { position:absolute; inset:-10px; border-radius:50%; border:3px solid var(--accent); opacity:.6; animation: arcadePulse 1.1s ease-out infinite; }
  @keyframes arcadePulse { 0%{ transform:scale(.85); opacity:.9;} 100%{ transform:scale(1.35); opacity:0;} }
  .glitch { animation: glitchFlicker .4s steps(2) 2; }
  @keyframes glitchFlicker { 0%{filter:none;} 25%{ filter:hue-rotate(30deg) saturate(2); transform:translateX(-2px);} 50%{filter:none;} 75%{ filter:hue-rotate(-30deg) saturate(2); transform:translateX(2px);} 100%{filter:none;} }

  /* ===== Chest halves (variant 4) ===== */
  .chest-half { position:absolute; width:100%; height:50%; background: linear-gradient(160deg, var(--accent-hi), var(--accent) 60%, var(--accent-lo,#7a5420)); }
  .chest-half.top { top:0; border-radius: 50px 50px 0 0; transform-origin: bottom center; }
  .chest-half.bottom { bottom:0; border-radius: 0 0 12px 12px; transform-origin: top center; }
  #overlay.show .chest-half.top { animation: chestOpenTop .6s ease-out .2s forwards; }
  #overlay.show .chest-half.bottom { animation: chestOpenBottom .6s ease-out .2s forwards; }
  @keyframes chestOpenTop { to { transform: rotateX(120deg) translateY(-6px); } }
  @keyframes chestOpenBottom { to { transform: scaleY(.94); } }
  .chest-glow { position:absolute; inset:-30px; border-radius:50%; background: radial-gradient(circle, color-mix(in srgb, var(--accent) 55%, transparent), transparent 70%); opacity:0; }
  #overlay.show .chest-glow { animation: chestGlow 1s ease-out .3s forwards; }
  @keyframes chestGlow { 0%{opacity:0; transform:scale(.5);} 60%{opacity:1;} 100%{opacity:.4; transform:scale(1.4);} }

  /* ===== Card flip (variant 5) ===== */
  .card3d-wrap { perspective: 800px; }
  .card3d { transform: rotateY(90deg); }
  #overlay.show .card3d { animation: flipIn .7s ease-out .1s forwards; }
  @keyframes flipIn { to { transform: rotateY(0deg); } }
  .holo { position:absolute; inset:0; border-radius:10px; background: linear-gradient(115deg, transparent 20%, rgba(255,255,255,.5) 35%, transparent 50%); background-size:300% 300%; background-position: -150% -150%; }
  #overlay.show .holo { animation: holoSweep 1.6s ease-out .6s forwards; }
  @keyframes holoSweep { to { background-position: 150% 150%; } }

  /* ===== XP ring (variant 6) ===== */
  .xp-ring-svg { position:absolute; inset:-8px; transform: rotate(-90deg); }
  .xp-ring-bg { fill:none; stroke: rgba(255,255,255,.08); stroke-width:6; }
  .xp-ring-fg { fill:none; stroke: var(--accent); stroke-width:6; stroke-linecap:round; stroke-dasharray: 345; stroke-dashoffset: 345; }
  #overlay.show .xp-ring-fg { animation: xpFill 1.4s ease-out .3s forwards; }
  @keyframes xpFill { to { stroke-dashoffset: 60; } }

  /* ===== Flame (variant 7) ===== */
  .flame {
    border-radius: 60% 40% 50% 50% / 60% 50% 50% 40%;
    background: linear-gradient(200deg, #FFE08A, var(--accent) 45%, #B23A1D);
    box-shadow: 0 0 40px color-mix(in srgb, var(--accent) 60%, transparent);
    animation: flicker 1.1s ease-in-out infinite;
  }
  @keyframes flicker {
    0%,100% { border-radius: 60% 40% 50% 50% / 60% 50% 50% 40%; transform: scale(1) rotate(0deg); }
    50% { border-radius: 50% 50% 40% 60% / 50% 60% 40% 50%; transform: scale(1.04) rotate(2deg); }
  }

  /* ===== Podium stripes (variant 8) ===== */
  .podium-stripes {
    position:absolute; inset:-40px -60px; z-index:-1; opacity:.15;
    background: repeating-conic-gradient(#fff 0% 6%, transparent 0% 12%);
  }

  /* ===== Crystal shards (variant 10) ===== */
  .shard { position:absolute; top:50%; left:50%; width:3px; height:60px; background: var(--accent); transform-origin: top center; opacity:0; }
  #overlay.show .shard { animation: shardOut .7s ease-out forwards; }
  @keyframes shardOut { 0%{ opacity:1; height:0;} 100%{ opacity:0; height:70px;} }

  /* ===== Particles (confetti / spark / firework) ===== */
  .particle { position:fixed; top:-10px; pointer-events:none; z-index:15; animation-timing-function: linear; animation-fill-mode:forwards; }
  .p-confetti { width:8px; height:14px; animation-name: fall; }
  @keyframes fall { to { transform: translateY(110vh) rotate(var(--spin)); opacity:.9; } }
  .p-firework { width:6px; height:6px; border-radius:50%; top:var(--fy); left:var(--fx); animation-name: fwOut; }
  @keyframes fwOut { to { transform: translate(var(--dx), var(--dy)); opacity:0; } }

  #tag { position:fixed; bottom:14px; right:16px; color:#3E5548; font-size:11px; }
</style>
</head>
<body>

<div id="picker"></div>
<div id="stage">
  <div id="overlay">
    <div class="rays"></div>
    <div class="card">
      <p class="eyebrow">WEEK 4 RESULT</p>
      <div id="badgeSlot" class="badge-wrap"></div>
      <h1 id="headline">Promoted!</h1>
      <div class="tier-move">
        <span class="from">Tier <b>15</b></span>
        <span class="arrow">→</span>
        <span class="to">Tier <b>14</b></span>
      </div>
      <div class="rank-line">New global rank: <strong id="rankNum">0</strong></div>
      <button class="cta" id="continueBtn">Continue</button>
    </div>
  </div>
</div>
<div id="tag">All CSS / SVG / JS — zero images, zero fonts, zero network cost</div>

<script>
const THEMES = [
  { id:'shield',   label:'1. Golden Shield',   accent:'#E8B44C', hi:'#FFD873', lo:'#7a5420', panel:'#0F2318', line:'#1E3A2A', shape:'shield',  particles:'confetti', glyph:'↑', extra:null },
  { id:'medal',    label:'2. Champion Medal',  accent:'#E8B44C', hi:'#FFD873', lo:'#7a5420', panel:'#241416', line:'#3A1E20', shape:'circle',  particles:'confetti', glyph:'★', extra:'medal' },
  { id:'arcade',   label:'3. Neon Arcade',     accent:'#3DE0D0', hi:'#B6FFF6', lo:'#106b63', panel:'#0E1E26', line:'#1E3A44', shape:'circle',  particles:'spark',    glyph:'▲', extra:'arcade' },
  { id:'chest',    label:'4. Royale Chest',    accent:'#E8B44C', hi:'#FFE9A8', lo:'#7a5420', panel:'#241914', line:'#3A2A1E', shape:'chest',   particles:'confetti', glyph:'',  extra:'chest' },
  { id:'card',     label:'5. Ultimate Card',   accent:'#8E6BFF', hi:'#C9B8FF', lo:'#3f2b8f', panel:'#181428', line:'#2A2140', shape:'card',    particles:'spark',    glyph:'14',extra:'card' },
  { id:'xpring',   label:'6. XP Level Ring',   accent:'#39C6A6', hi:'#9BFFE4', lo:'#0d5a4a', panel:'#0F2320', line:'#1E3A34', shape:'circle',  particles:'spark',    glyph:'14',extra:'xpring' },
  { id:'flame',    label:'7. Streak Flame',    accent:'#FF7A3D', hi:'#FFD08A', lo:'#7a2a10', panel:'#241812', line:'#3A2418', shape:'flame',   particles:'firework', glyph:'',  extra:null },
  { id:'podium',   label:'8. Podium Gold',     accent:'#E8B44C', hi:'#FFD873', lo:'#7a5420', panel:'#141c24', line:'#213040', shape:'circle',  particles:'confetti', glyph:'1', extra:'podium' },
  { id:'firework', label:'9. Fireworks Night', accent:'#FF5C8A', hi:'#FFC2D6', lo:'#7a1f3c', panel:'#0B0F24', line:'#1B2140', shape:'circle',  particles:'firework', glyph:'✦', extra:null },
  { id:'crystal',  label:'10. Crystal Ascend', accent:'#5CCBFF', hi:'#D6F3FF', lo:'#0f5a80', panel:'#0C1B24', line:'#1B3040', shape:'diamond', particles:'spark',    glyph:'◆', extra:'crystal' },
];

const picker = document.getElementById('picker');
const overlay = document.getElementById('overlay');
const badgeSlot = document.getElementById('badgeSlot');
const rankEl = document.getElementById('rankNum');
const headline = document.getElementById('headline');
const root = document.documentElement;

THEMES.forEach(t => {
  const b = document.createElement('button');
  b.textContent = t.label;
  b.onclick = () => play(t, b);
  picker.appendChild(b);
});

function clearParticles(){ document.querySelectorAll('.particle').forEach(p => p.remove()); }
function clearExtras(){ document.querySelectorAll('.shard, .chest-glow, .podium-stripes, .arcade-ring').forEach(e => e.remove()); }

function burstConfetti(count, colors) {
  for (let i=0;i<count;i++){
    const el = document.createElement('div');
    el.className = 'particle p-confetti';
    const duration = 1.6 + Math.random()*1.2;
    const delay = Math.random()*0.15;
    const spin = (Math.random()>0.5?1:-1)*(360+Math.random()*360)+'deg';
    el.style.left = (Math.random()*100)+'vw';
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.setProperty('--spin', spin);
    el.style.animationDuration = duration+'s';
    el.style.animationDelay = delay+'s';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), (duration+delay)*1000+100);
  }
}

function burstSparks(colors){
  const rect = badgeSlot.getBoundingClientRect();
  const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
  for (let i=0;i<26;i++){
    const el = document.createElement('div');
    el.className = 'particle p-firework';
    const angle = Math.random()*Math.PI*2;
    const dist = 60+Math.random()*90;
    el.style.setProperty('--fx', cx+'px');
    el.style.setProperty('--fy', cy+'px');
    el.style.setProperty('--dx', Math.cos(angle)*dist+'px');
    el.style.setProperty('--dy', Math.sin(angle)*dist+'px');
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.animationDuration = '.8s';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 850);
  }
}

function burstFireworks(colors){
  const points = [[0.3,0.35],[0.7,0.3],[0.5,0.55]];
  points.forEach((p, idx) => {
    setTimeout(() => {
      const cx = window.innerWidth*p[0], cy = window.innerHeight*p[1];
      for (let i=0;i<30;i++){
        const el = document.createElement('div');
        el.className = 'particle p-firework';
        const angle = Math.random()*Math.PI*2;
        const dist = 70+Math.random()*110;
        el.style.setProperty('--fx', cx+'px');
        el.style.setProperty('--fy', cy+'px');
        el.style.setProperty('--dx', Math.cos(angle)*dist+'px');
        el.style.setProperty('--dy', Math.sin(angle)*dist+'px');
        el.style.background = colors[Math.floor(Math.random()*colors.length)];
        el.style.animationDuration = '.9s';
        document.body.appendChild(el);
        setTimeout(()=>el.remove(), 950);
      }
    }, idx*220);
  });
}

function countUp(el, from, to, ms=900){
  const start = performance.now();
  function tick(now){
    const p = Math.min(1, (now-start)/ms);
    const eased = 1 - Math.pow(1-p, 3);
    el.textContent = Math.round(from + (to-from)*eased).toLocaleString();
    if (p<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function buildBadge(t){
  badgeSlot.innerHTML = '';
  const badge = document.createElement('div');
  badge.className = 'badge shape-' + (t.shape==='chest'?'circle':t.shape==='card'?'card':t.shape);

  if (t.shape === 'chest') {
    badgeSlot.innerHTML = `
      <div class="chest-glow"></div>
      <div class="chest-half bottom"></div>
      <div class="chest-half top"></div>`;
    return;
  }
  if (t.shape === 'flame') {
    badgeSlot.style.width='96px'; badgeSlot.style.height='112px';
    const flame = document.createElement('div');
    flame.className = 'flame';
    flame.style.width='100%'; flame.style.height='100%';
    badgeSlot.appendChild(flame);
    return;
  }

  badge.innerHTML = `<span>${t.glyph}</span>`;
  badgeSlot.appendChild(badge);

  if (t.extra === 'medal') {
    const l = document.createElement('div'); l.className='ribbon left';
    const r = document.createElement('div'); r.className='ribbon right';
    badgeSlot.appendChild(l); badgeSlot.appendChild(r);
  }
  if (t.extra === 'arcade') {
    const ring = document.createElement('div'); ring.className='arcade-ring';
    badgeSlot.appendChild(ring);
    badge.classList.add('glitch');
  }
  if (t.extra === 'card') {
    badgeSlot.classList.add('card3d-wrap');
    badge.classList.add('card3d');
    const holo = document.createElement('div'); holo.className='holo';
    badge.appendChild(holo);
  }
  if (t.extra === 'xpring') {
    const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('class','xp-ring-svg'); svg.setAttribute('viewBox','0 0 120 120');
    svg.innerHTML = `
      <circle class="xp-ring-bg" cx="60" cy="60" r="55"/>
      <circle class="xp-ring-fg" cx="60" cy="60" r="55"/>`;
    badgeSlot.appendChild(svg);
  }
  if (t.extra === 'podium') {
    const stripes = document.createElement('div'); stripes.className='podium-stripes';
    badgeSlot.appendChild(stripes);
  }
  if (t.extra === 'crystal') {
    for (let i=0;i<8;i++){
      const shard = document.createElement('div');
      shard.className='shard';
      shard.style.transform = `translate(-50%,-100%) rotate(${i*45}deg)`;
      shard.style.animationDelay = (i*0.03)+'s';
      badgeSlot.appendChild(shard);
    }
  }
}

let active = null;
function play(t, btn){
  clearParticles(); clearExtras();
  overlay.classList.remove('show','backdrop-flash');
  root.style.setProperty('--accent', t.accent);
  root.style.setProperty('--accent-hi', t.hi);
  root.style.setProperty('--accent-lo', t.lo);
  root.style.setProperty('--panel', t.panel);
  root.style.setProperty('--panel-line', t.line);
  root.style.setProperty('--ribbon', '#B23A3A');

  buildBadge(t);

  // restart entrance animations
  void overlay.offsetWidth;
  overlay.classList.add('show','backdrop-flash');
  setTimeout(()=>overlay.classList.remove('backdrop-flash'), 600);

  const colors = [t.accent, t.hi, '#F1F5EE'];
  if (t.particles === 'confetti') setTimeout(()=>burstConfetti(42, colors), 50);
  if (t.particles === 'spark') setTimeout(()=>burstSparks(colors), 350);
  if (t.particles === 'firework') setTimeout(()=>burstFireworks(colors), 100);

  setTimeout(()=>countUp(rankEl, 812, 671), 300);

  if (active) active.classList.remove('active');
  if (btn) { btn.classList.add('active'); active = btn; }
}

document.getElementById('continueBtn').addEventListener('click', () => overlay.classList.remove('show'));

// auto-play the first theme on load
play(THEMES[0], picker.children[0]);
</script>
</body>
</html>
